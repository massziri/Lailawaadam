<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>إدارة الردود — ليلى وآدم</title><link rel="stylesheet" href="/style.css"><script defer src="/admin/panel.js"></script><style>.panel{padding-block:45px}.panel [hidden]{display:none}.panel label{display:block}.panel input,.panel select{max-width:100%;padding:6px 12px;margin:5px 0 12px;background:#fffdfa;border:1px solid #b6a489;border-radius:5px}.panel-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0}.scroll{overflow:auto}.panel table{width:100%;border-collapse:collapse;background:#fffbf3}.panel td,.panel th{padding:8px 10px;border-bottom:1px solid #ddcbb1;text-align:start}.panel caption{text-align:start}.panel td[dir=ltr]{text-align:right}</style></head><body><main class="panel wrap"><p class="eyebrow">ليلى وآدم</p><h1>إدارة الردود</h1><p id="notice" role="status"></p><form id="login" hidden method="post" action="/api/rsvp"><label for="password">كلمة المرور</label><input dir="ltr" type="password" id="password" name="password" autocomplete="current-password" maxlength="160" required><button class="btn dark" type="submit">دخول</button></form><section id="dashboard" hidden><div class="panel-row"><button class="btn dark" id="refresh">تحديث</button><button class="btn dark" id="logout">تسجيل الخروج</button><label for="filter">عرض</label><select id="filter"><option value="all">جميع الردود</option><option value="yes">الحضور</option><option value="no">الاعتذارات</option></select></div><p id="total"></p><div class="scroll"><table><caption>الردود المسجّلة</caption><thead><tr><th>الاسم الكامل</th><th>الهاتف</th><th>البريد الإلكتروني</th><th>الردّ</th><th>العدد</th><th>التاريخ</th><th>إجراء</th></tr></thead><tbody id="rows"></tbody></table></div></section><noscript>يرجى تفعيل جافاسكريبت.</noscript><p><a href="/">العودة إلى الدعوة</a></p></main></body></html>
